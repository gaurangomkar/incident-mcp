version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - misspell
    - unconvert
    - unparam
    - bodyclose
    - copyloopvar
    - durationcheck
    - usestdlibvars

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gaurangomkar/incident-mcp

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
