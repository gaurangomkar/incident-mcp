# Bind this to a dedicated ServiceAccount. It is the Kubernetes access
# incident-mcp actually uses: get and list on pods, pod logs, events, and deployments.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: incident-mcp-read
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
# Prefer a Role in each allowed namespace when the allowlist is small.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-mcp-read
  namespace: payments
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
